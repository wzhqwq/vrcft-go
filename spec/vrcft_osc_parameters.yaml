schema_version: 1
source:
  title: VRCFaceTracking Parameters
  documentation_version: Current (v5.0)
  url: https://docs.vrcft.io/docs/tutorial-avatars/tutorial-avatars-extras/parameters
  retrieved_date: '2026-07-20'
  scope: All parameters publicly listed on the referenced documentation page.
  limitations:
  - The documentation states that additional optimization-oriented parameters may remain undocumented.
  - Float tracking parameters may also be represented through the documented Binary parameter form.
  - Prefixed parameter paths are supported; osc_name records the canonical suffix rather than a full /avatar/parameters address.
conventions:
  default_osc_address_prefix: /avatar/parameters/
  canonical_version_prefix: v2/
  prefix_examples:
  - v2/JawOpen
  - ExamplePrefix/v2/JawOpen
  - Example/Nest/v2/JawOpen
  float_encodings:
  - float
  - binary
  binary_note: Binary parameters use boolean bit parameters and, for signed values, a separate Negative boolean.
counts:
  detailed_float_parameters: 88
  simplified_float_parameters: 36
  float_parameters_total: 124
  status_bool_parameters: 3
  all_parameters_total: 127
